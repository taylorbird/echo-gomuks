<!doctype html>
<html lang="en" data-gomuks="true">
<head>
	<meta charset="UTF-8"/>
	<link id="favicon" rel="icon" type="image/png" href="gomuks.png"/>
	<link rel="manifest" href="manifest.json"/>
	<meta id="theme-color-light" name="theme-color" media="(prefers-color-scheme: light)" content=""/>
	<meta id="theme-color-dark" name="theme-color" media="(prefers-color-scheme: dark)" content=""/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover"/>
	<title>echo</title>
	<!-- etag placeholder -->
</head>
<body>
	<div id="root"></div>
	<script type="module">
		// The etag meta tag is injected by the gomuks server when it serves the frontend, so
		// its absence normally means there's no backend to talk to. Tauri serves dist itself
		// and still has a backend (the sidecar), so it has to be excluded here or the app
		// would fall back to standalone wasm.
		window.gomuksWebWasm = import.meta.env.PROD
			&& !window.__TAURI_INTERNALS__
			&& !document.querySelector("meta[name=gomuks-frontend-etag]")
		// Tauri overlays its titlebar on the content and puts a vibrancy layer behind the webview.
		// Mark the document so the CSS can inset for the traffic lights and go translucent.
		if (window.__TAURI_INTERNALS__) {
			document.documentElement.dataset.tauri = "true"
			// Linux has a native title bar and no vibrancy; index.css undoes the mac chrome for it.
			if (/Linux/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent)) {
				document.documentElement.dataset.platform = "linux"
			}
		}
	</script>
	<script type="module" src="src/main.tsx"></script>
	<svg style="position: absolute; width: 0; height: 0;" viewBox="0 0 1 1" xmlns="http://www.w3.org/2000/svg">
		<defs>
			<clipPath id="squircle" clipPathUnits="objectBoundingBox">
				<path d="M0 .5C0 0 0 0 .5 0S1 0 1 .5 1 1 .5 1 0 1 0 .5"/>
			</clipPath>
		</defs>
	</svg>
</body>
</html>
