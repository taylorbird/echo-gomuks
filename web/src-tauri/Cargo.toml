[package]
name = "app"
version = "0.7.4"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Keep the minor version in lockstep with @tauri-apps/api in package.json —
# the tauri CLI flags a mismatch as an error and plugin IPC may misbehave.
tauri = { version = "2.11", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
percent-encoding = "2"
# For minting the backend session token ourselves, exactly as pkg/gomuks/server.go signToken
# does: HMAC-SHA256 over the compact JSON, both halves base64url-unpadded.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# Only to seed the backend's password field on a fresh install; the password is discarded
# immediately, so nothing can ever authenticate with it. See ensure_backend_config in lib.rs.
bcrypt = "0.17"
rand = "0.9"

# Only to hand the main window a WKWebViewConfiguration with inline predictions on (see
# macos_webview_configuration in lib.rs). Same versions tauri itself already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3", features = ["WKWebViewConfiguration"] }
