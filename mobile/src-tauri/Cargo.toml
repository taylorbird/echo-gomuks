[package]
name = "echo-mobile"
version = "0.1.0"
description = "echo for iOS: the echo frontend over gomuks linked in through its C FFI"
edition = "2021"
rust-version = "1.77.2"

# Its own workspace and lockfile, so the desktop app in web/src-tauri is untouched.
[workspace]

[lib]
name = "echo_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Same minor as the desktop app and @tauri-apps/api in web/package.json.
# custom-protocol: serve the web/dist embedded at build time. Without it a debug build looks
# for a dev server (the Tauri CLI adds it itself; this app is built with plain cargo, see
# ../xcode-build-rust.sh).
tauri = { version = "2.11", features = ["custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
percent-encoding = "2"
